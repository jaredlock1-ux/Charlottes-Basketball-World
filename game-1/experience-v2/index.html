</style></head><body><div id="world"></div><script>const modules={};modules.engine=(()=>{
const VERSION = 'G1-engine-1.4.0';
const other = team => team === 'Magic' ? 'Falcons' : 'Magic';
const possessionId = n => 'G1-P' + String(n).padStart(2, '0');

// The engine owns score, clock, ball and possession. Presentation receives copies.
function createEngine(seed = 314159, rolls = []) {
  let rng = seed >>> 0, scripted = [...rolls], events = [];
  let x = { version: VERSION, seed, half: 1, clock: 1200, score: {Magic: 0, Falcons: 0},
    team: null, pos: 0, phase: 'opening', ball: 'dead', nextTeam: null,
    decisions: 0, shots: 0, points: 0, rebounds: 0, stops: 0, turnovers: 0,
    teamRebounds: {Magic: 0, Falcons: 0}, teamTurnovers: {Magic: 0, Falcons: 0},
    pressure: 'low', fatigue: 'low', attempt: null, freeThrows: null, ended: false,
    restartTeam: 'Falcons', askedForBall: 0, wentIntoSpace: 0, goodPasses: 0, bravePlays: 0,
    looseBalls: 0, wentAfterBall: 0, trust: 0, attention: 0, recoveredAfterMistake: 0, mistake: false };
  const state = () => structuredClone(x);
  function emit(type, detail = {}) {
    events.push({id: 'E' + (events.length + 1), type, cause: detail.cause || type.toLowerCase(),
      playerAction: null, physicalOutcome: null, scoreChange: 0, possessionChange: null,
      ...detail, stateAfter: state()});
  }
  function requirePhase(...phases) {
    if (x.ended || !phases.includes(x.phase)) throw Error('Invalid action in ' + x.phase);
  }
  function random() {
    const before = rng;
    rng = (Math.imul(1664525, rng) + 1013904223) >>> 0;
    const value = scripted.length ? scripted.shift() : rng / 4294967296;
    if (!(value >= 0 && value < 1)) throw Error('Invalid random input');
    emit('RANDOM_DRAW', {seedBefore: before, value});
    return value;
  }
  function pressure() {
    x.pressure = x.clock <= 120 ? 'late' : x.clock <= 480 ? 'high' : x.clock <= 900 ? 'moderate' : 'low';
    const elapsed = (x.half - 1) * 1200 + 1200 - x.clock;
    x.fatigue = elapsed >= 1800 ? 'high' : elapsed >= 900 ? 'moderate' : 'low';
  }
  function tick(seconds, cause) {
    requirePhase('live', 'rebound', 'attempt');
    if (!Number.isInteger(seconds) || seconds < 0 || seconds > 30 || !cause) throw Error('Clock requires a bounded live event');
    const elapsed = Math.min(seconds, x.clock);
    x.clock -= elapsed; pressure();
    emit('CLOCK_TICK', {cause, elapsed});
  }
  function begin(team, cause) {
    if (!['Magic', 'Falcons'].includes(team) || x.ended || !['opening', 'between', 'halftime'].includes(x.phase)) throw Error('Invalid possession start');
    x.team = team; x.pos++; x.phase = 'live'; x.ball = 'live'; x.nextTeam = null;
    x.attempt = null;
    emit('POSSESSION_START', {cause, possessionChange: team, possessionId: possessionId(x.pos)});
  }
  function end(cause, nextTeam) {
    x.phase = 'between'; x.ball = 'dead'; x.nextTeam = nextTeam;
    emit('POSSESSION_END', {cause, nextTeam, possessionId: possessionId(x.pos)});
  }
  function boundary() {
    if (x.phase === 'halftime' || x.ended) return true;
    if (x.clock !== 0 || x.phase === 'free_throw') return false;
    if (x.phase !== 'between') end('period_expired', null);
    x.restartTeam = x.nextTeam || other(x.team || 'Magic');
    x.nextTeam = null; x.team = null;
    if (x.half === 1) { x.phase = 'halftime'; x.ball = 'dead'; emit('HALFTIME'); }
    else { x.phase = 'final'; x.ball = 'ended'; x.ended = true; emit('FINAL_WHISTLE', {finalScore: {...x.score}}); }
    return true;
  }
  function advance() {
    requirePhase('between');
    if (!boundary()) begin(x.nextTeam, 'resolved_possession');
  }
  function decision(choices, chosen, type, id) {
    requirePhase('live', 'rebound', 'attempt');
    if ((type === 'shooting' ? choices.length !== 4 : choices.length !== 3) || !choices.includes(chosen)) throw Error('Choice contract');
    x.decisions++;
    emit('DECISION', {playerAction: chosen, decisionType: type, decisionId: id,
      choiceId: id + '-C' + (choices.indexOf(chosen) + 1), choices: [...choices]});
  }
  function prepareShot(value, shooter = 'teammate') {
    requirePhase('live');
    if (![2, 3].includes(value) || !['you', 'teammate', 'opponent'].includes(shooter)) throw Error('Attempt contract');
    if ((shooter === 'opponent') !== (x.team === 'Falcons')) throw Error('Shooter ownership');
    x.attempt = {team: x.team, shooter, value}; x.phase = 'attempt';
    if (shooter === 'you') x.shots++;
    emit('ATTEMPT_ESTABLISHED', {team: x.team, shotValue: value, shooter,
      physicalOutcome: value === 3 ? 'three_point_attempt' : 'two_point_attempt'});
  }
  function score(team, value, type, detail) {
    x.score[team] += value;
    if (detail.shooter === 'you') x.points += value;
    emit(type, {...detail, team, scoreChange: value});
  }
  function resolveShot({make = .40, block = .08, foul = .12} = {}) {
    requirePhase('attempt');
    if ([make, block, foul].some(v => v < 0) || make + block + foul > 1) throw Error('Shot probabilities');
    const a = {...x.attempt}, r = random();
    const outcome = r < make ? 'made' : r < make + block ? 'blocked' : r < make + block + foul ? 'foul' : 'miss';
    emit('SHOT_OUTCOME', {...a, shotValue: a.value, physicalOutcome: outcome});
    if (outcome === 'made') {
      score(a.team, a.value, 'MADE_BASKET', {...a, physicalOutcome: 'made_basket'});
      end('made_basket', other(a.team));
    } else if (outcome === 'foul') {
      x.phase = 'free_throw'; x.ball = 'free_throw';
      x.freeThrows = {team: a.team, shooter: a.shooter, total: 2, next: 1};
      emit('SHOOTING_FOUL', {freeThrows: 2, team: a.team});
    } else {
      x.phase = 'rebound'; x.ball = 'live';
      emit(outcome === 'miss' ? 'SHOT_MISS' : 'SHOT_BLOCK', {team: a.team, physicalOutcome: outcome});
    }
    return {...a, outcome};
  }
  function rebound(actionIndex) {
    requirePhase('rebound');
    if (![0, 1, 2].includes(actionIndex)) throw Error('Rebound action');
    if (x.clock === 0) { boundary(); return {expired: true}; }
    const offense = x.team, r = random();
    // Positioning changes chances; no button selects the winner.
    const you = offense === 'Magic' ? [.22, .04, .08][actionIndex] : [.40, .18, .24][actionIndex];
    const teammate = offense === 'Magic' ? [.16, .20, .28][actionIndex] : [.35, .48, .46][actionIndex];
    const winner = r < you ? 'you' : r < you + teammate ? 'teammate' : 'opponent';
    const team = winner === 'opponent' ? 'Falcons' : 'Magic';
    if (actionIndex === 0) x.wentAfterBall++;
    if (winner === 'you') { x.rebounds++; x.looseBalls++; }
    x.teamRebounds[team]++;
    x.phase = 'live'; x.attempt = null;
    emit('REBOUND_OUTCOME', {winner, team, physicalOutcome: winner + '_rebound', offensive: team === offense});
    if (team === offense) emit('SECOND_CHANCE', {team, physicalOutcome: 'offense_retains_ball'});
    else end('defensive_rebound', team);
    return {winner, team, offensive: team === offense};
  }
  function freeThrow(makeChance = .65) {
    requirePhase('free_throw');
    const f = {...x.freeThrows}, made = random() < makeChance;
    if (made) score(f.team, 1, 'FREE_THROW_MADE', {...f, index: f.next, physicalOutcome: 'made_free_throw'});
    else emit('FREE_THROW_MISSED', {...f, index: f.next, physicalOutcome: 'missed_free_throw'});
    x.freeThrows.next++;
    if (f.next === f.total) {
      x.freeThrows = null;
      if (made) end('last_free_throw_made', other(f.team));
      else { x.phase = 'rebound'; x.ball = 'live'; emit('LIVE_BALL', {cause: 'last_free_throw_missed'}); }
    }
    return {made, index: f.next, total: f.total, team: f.team};
  }
  function turnover(cause = 'lost_ball', stealBy = null) {
    requirePhase('live');
    const team = x.team;
    x.teamTurnovers[team]++; x.turnovers++;
    emit('TURNOVER', {team, physicalOutcome: cause});
    if (team === 'Magic') x.mistake = true;
    if (stealBy) { if (stealBy === 'you') { x.stops++; if(x.mistake)x.recoveredAfterMistake++; x.mistake=false; } emit('STEAL', {team: other(team), player: stealBy, physicalOutcome: 'steal'}); }
    end(cause, other(team));
  }
  function defend(actionIndex, vulnerable = false) {
    requirePhase('live');
    if (x.team !== 'Falcons' || ![0, 1, 2].includes(actionIndex)) throw Error('Defence contract');
    const chance = vulnerable ? [.65, .80, .45][actionIndex] : [.08, .14, .04][actionIndex];
    const success = random() < chance;
    if (success) turnover('defensive_pressure', 'you');
    else emit('DEFENSIVE_RECOVERY', {physicalOutcome: actionIndex === 1 ? 'dribbler_gets_past' : 'opponent_retains_ball'});
    return success;
  }
  function deadBall(cause = 'out_of_bounds') {
    requirePhase('live'); x.phase = 'dead_ball'; x.ball = 'dead'; emit('DEAD_BALL', {cause});
  }
  function restart() {
    requirePhase('dead_ball'); x.phase = 'live'; x.ball = 'live'; emit('RESTART', {team: x.team});
  }
  function resume() {
    requirePhase('halftime'); x.half = 2; x.clock = 1200; pressure();
    begin(x.restartTeam, 'second_half_restart'); emit('SECOND_HALF_START');
  }
  function seekBall(index) {
    requirePhase('live'); if(x.team!=='Magic'||![0,1,2].includes(index))throw Error('Offence contract');
    if(index===0){x.askedForBall++;x.trust=Math.min(5,x.trust+1);x.attention=Math.min(5,x.attention+1);x.bravePlays++;}
    if(index===1){x.wentIntoSpace++;x.trust=Math.min(5,x.trust+.5);}
    const r=random(), receive=[.60+x.trust*.025,.50+x.trust*.025,.18][index];
    if(index===0&&r>.94){turnover('pass_intercepted');return 'intercepted';}
    const outcome=r<receive?'received':'teammate_continues';
    emit('PASS', {physicalOutcome:outcome, playerAction:index});return outcome;
  }
  function handleBall(index) {
    requirePhase('live');if(x.team!=='Magic'||![0,1,2].includes(index))throw Error('Ball handling contract');
    const r=random();
    if(r>(index===1?.90:index===2?.78:.92)){turnover('ball_intercepted');return 'turnover';}
    if(index===0&&r<.72){x.bravePlays++;emit('DRIVE',{physicalOutcome:'scoring_space'});return 'shot';}
    x.goodPasses++;emit('PASS',{physicalOutcome:'teammate_receives'});return 'pass';
  }
  return {state, trace: () => structuredClone(events), decision, tick, random, prepareShot,
    resolveShot, rebound, freeThrow, turnover, defend, deadBall, restart, advance, boundary, resume, seekBall, handleBall,
    start() { requirePhase('opening'); begin('Magic', 'opening_tip'); emit('TIP_OFF', {physicalOutcome: 'Magic_win_tip'}); },
    annotate(type, detail) { emit(type, detail); }};
}

return {VERSION,other,possessionId,createEngine};})();
modules.content=(()=>{
const NORMAL = ['Call for the ball','Move into the open space','Keep moving and stay ready'];
const SHOTS = ['Pump fake, then layup','Drive for the layup','Take the shot','Side step and take the shot'];
const REBOUNDS = ['Go after the ball','Get back to defend','Stay ready for the next play'];
const DEFENCE = ['Stay in front of them','Move quickly to cut off their path','Protect the basket'];
const DEF_SHOTS = ['Put your hand up and make the shot difficult','Jump to try to block the shot','Get ready for the rebound'];
const RECOVERY = ['Get back to defend','Find your player','Move towards the ball'];
const BALL_HAND = ['Move towards the basket','Pass to the open teammate','Keep the ball and look again'];
// Authored slot identity is independent from runtime possession identity.
// Branch-only slots are emitted by the live chain; anchors wait for the correct owner.
const SPINE = [
  ['P01',1,1200,'tip'],['P02',1,1176,'normal','Magic'],['P03',1,null,'branch'],
  ['P04',1,1080,'defence','Falcons'],['P05',1,990,'background','Magic'],
  ['P06',1,945,'normal','Magic'],['P07',1,null,'branch'],['P08',1,870,'defence','Falcons'],
  ['P09',1,810,'shooting','Magic'],['P10',1,null,'branch'],['P11',1,null,'branch'],
  ['P12',1,690,'defence','Falcons'],['P13',1,570,'normal','Magic'],['P14',1,null,'branch'],
  ['P15',1,450,'recovery','Falcons'],['P16',1,330,'normal','Magic'],['P17',1,150,'normal','Magic'],
  ['P18',1,0,'halftime'],['P19',2,1200,'restart'],['P20',2,1170,'normal','Magic'],
  ['P21',2,null,'branch'],['P22',2,960,'shooting','Magic'],['P23',2,900,'defence','Falcons'],
  ['P24',2,720,'normal','Magic'],['P25',2,540,'event'],['P26',2,360,'normal','Magic'],
  ['P27',2,240,'normal','Magic'],['P28',2,120,'late'],['P29',2,30,'final_play'],['P30',2,0,'final']
].map(([id,half,clock,kind,team])=>({id,half,clock,kind,team}));
const fmt = clock => String(Math.floor(clock / 60)).padStart(2,'0') + ':' + String(clock % 60).padStart(2,'0');
function shotText(result) {
  const who = result.shooter === 'you' ? 'Your' : result.team === 'Magic' ? 'Your teammate’s' : 'The Falcons’';
  const shot = result.value === 3 ? 'three-point shot' : 'shot';
  if (result.outcome === 'made') return `${who} ${shot} is good! ${result.value} points for ${result.team}.`;
  if (result.outcome === 'foul') return `${who} ${shot} draws a shooting foul. No basket. Two free throws for ${result.team}.`;
  return `${who} ${shot} ${result.outcome === 'blocked' ? 'is blocked' : 'misses'}. No points. The ball is live.`;
}
function reboundText(r) {
  if(r.expired) return 'The horn sounds before anyone can collect the rebound.';
  const who = r.winner === 'you' ? 'You win the rebound.' : r.winner === 'teammate' ? 'Your teammate wins the rebound.' : 'The Falcons win the rebound.';
  return `${who} ${r.offensive ? r.team + ' keep the same possession for a second chance.' : r.team + ' have the ball next.'}`;
}
function freeThrowText(f) {
  return `${f.index === 1 ? 'First' : 'Second'} free throw for ${f.team}: ${f.made ? 'good! One point.' : 'missed. No point.'}`;
}

return {NORMAL,SHOTS,REBOUNDS,DEFENCE,DEF_SHOTS,RECOVERY,BALL_HAND,SPINE,fmt,shotText,reboundText,freeThrowText};})();
modules.game=(()=>{const {createEngine,possessionId}=modules.engine;const {NORMAL,SHOTS,REBOUNDS,DEFENCE,DEF_SHOTS,RECOVERY,BALL_HAND,SPINE,fmt,shotText,reboundText,freeThrowText}=modules.content;

function createGame({seed=1, rolls=[], fixture=null}={}) {
  const e=createEngine(seed,rolls); let screen, revision=0, actions=[], anchor=1, currentSlot='P01',
    spotlight=false, chainDecisions=0, vulnerable=false, recovered=false, sinceDecision=0;
  const state=()=>e.state();
  function show(text, buttons=[],kind='result', extra={}) {
    revision++; actions=buttons.map(b=>b[1]);
    screen={revision,text,kind,choices:buttons.map(b=>b[0]),state:state(),slot:currentSlot,...extra};

function courtModel(v,trace){
  const x=v.source.state,s=v.stage, reb=trace.findLast(e=>e.type==='REBOUND_OUTCOME');
  const ft=trace.findLast(e=>['FREE_THROW_MADE','FREE_THROW_MISSED'].includes(e.type));
  const flight=['flight','ft-flight'].includes(s),loose=['miss','blocked','rebound','contest'].includes(s)||(s==='ft-result'&&x.phase==='rebound');
  const possession=flight||loose?null:x.phase==='between'?x.nextTeam:x.team;
  const attacking=flight||loose||['made','foul','ft-result'].includes(s)?v.shot?.team||x.team:possession||x.team;
  const magic=attacking==='Magic', basket=magic?60:940;
  const positions={C:[685,280],M1:[790,135],M2:[800,425],M3:[475,120],M4:[450,435],F1:[600,280],F2:[875,115],F3:[875,440],F4:[400,120],F5:[365,440]};
  const attackingStage=['transition','offence','offmove','ballhand','drive','shoot','teammate-set'].includes(s)||magic&&['flight','made','foul','ft-flight','ft-result','miss','rebound','contest','blocked'].includes(s);
  if(attackingStage){
    Object.assign(positions,{C:[300,285],M1:[375,170],M2:[320,430],M3:[540,120],M4:[595,430],F1:[220,275],F2:[245,135],F3:[235,415],F4:[445,135],F5:[505,405]});
    if(!magic)for(const p of Object.values(positions))p[0]=1000-p[0];
  }
  if(s==='arrival'){positions.F1=[500,280];positions.C=[620,280];}
  if(['pressure','intent','flight','foul','ft-flight','ft-result','made'].includes(s)&&!magic){positions.F1=v.shot?.value===3||x.attempt?.value===3?[650,280]:[810,280];positions.C=[positions.F1[0]+50,300];}
  if(['shoot','drive'].includes(s)){positions.C=[200,280];positions.F1=[145,290];}
  if(['ballhand','offmove'].includes(s))positions.C=[300,245];
  let shooter=v.shot?.shooter==='you'?'C':v.shot?.team==='Magic'?'M1':'F1';
  if(['teammate-set','flight'].includes(s)&&magic){
    positions[shooter]=v.shot?.value===3?[350,280]:[210,265];
    // Keep Casey on the basket side of Charlotte's release, visibly separate.
    if(shooter==='C')positions.F1=[positions.C[0]-55,positions.C[1]+25];
  }
  if(['miss','blocked','rebound','contest','secured'].includes(s)){
    const left=v.shot?.team==='Magic';
    Object.assign(positions,{C:[820,235],M1:[810,345],M2:[700,430],F1:[865,300],F2:[560,120],F3:[770,420],F5:[925,380]});
    if(left)for(const p of Object.values(positions))p[0]=1000-p[0];
  }
  let owner=possession==='Magic'?'M1':'F1';
  if(['ballhand','drive','shoot'].includes(s))owner='C';
  if(['intent','pressure'].includes(s))owner='F1';
  if(s==='teammate-set')owner=x.team==='Magic'?'M1':'F1';
  if(s==='secured')owner=reb?.winner==='you'?'C':reb?.winner==='teammate'?'M1':'F1';
  if(s==='steal')owner='C';
  if(['foul','ft-result'].includes(s))owner=shooter;
  if(['foul','ft-flight','ft-result'].includes(s))positions[shooter]=[v.shot?.team==='Magic'?205:795,280];
  if(flight||loose||s==='made'||s==='ft-result'||s==='end')owner=null;
  const players=ROSTER.map(p=>({...p,x:positions[p.id][0],y:positions[p.id][1],ownsBall:p.id===owner}));
  const carrier=players.find(p=>p.id===owner);
  const inNet=s==='made'||s==='ft-result'&&ft?.type==='FREE_THROW_MADE';
  const ball={owner,status:flight?'in-flight':loose?'loose':inNet?'through-net':owner?'held':'dead',x:carrier?carrier.x+25:basket,y:carrier?carrier.y+8:inNet?310:280};
  const origin=positions[shooter]||[810,280];
  return {players,ball,origin:{x:origin[0],y:origin[1]},possession,attacking,direction:magic?'left':'right',basket,score:x.score,clock:x.clock,half:x.half,shotValue:v.shot?.value||null};
}
function courtShell(){return `<svg viewBox="0 0 1000 560" role="img" aria-labelledby="court-title court-desc"><title id="court-title">Basketball court</title><desc id="court-desc"></desc><defs><linearGradient id="wood-g" x2="0" y2="1"><stop stop-color="#ffd69a"/><stop offset=".5" stop-color="#edb974"/><stop offset="1" stop-color="#f6ca89"/></linearGradient><pattern id="planks" width="160" height="36" patternUnits="userSpaceOnUse"><path d="M0 0H160M80 0V36" stroke="#a87334" opacity=".16" fill="none"/></pattern><filter id="shadow"><feDropShadow dy="3" stdDeviation="3" flood-opacity=".3"/></filter></defs><rect x="8" y="8" width="984" height="544" rx="18" fill="url(#wood-g)"/><rect x="8" y="8" width="984" height="544" rx="18" fill="url(#planks)"/><g fill="none" stroke="#fff6de" stroke-width="3"><rect x="28" y="28" width="944" height="504"/><path d="M500 28V532"/><circle cx="500" cy="280" r="64"/><path d="M28 181H205V379H28M972 181H795V379H972"/><circle cx="205" cy="280" r="62"/><circle cx="795" cy="280" r="62"/><path d="M28 55H60A225 225 0 0 1 60 505H28M972 55H940A225 225 0 0 0 940 505H972"/></g><g fill="#066798" fill-opacity=".7"><path d="M28 183H145V377H28ZM972 183H855V377H972Z"/></g><g stroke="#fff" stroke-width="5" fill="none"><path d="M42 246V314M958 246V314"/></g><g stroke="#d45416" stroke-width="5" fill="none"><circle cx="60" cy="280" r="12"/><circle cx="940" cy="280" r="12"/></g><path id="attack-arrow" d="M0 0H64L49 -9M64 0L49 9" fill="none" stroke="#18394a" opacity=".5" stroke-width="3"/><g id="tokens">${ROSTER.map(p=>`<g id="token-${p.id}" data-player="${p.id}" data-team="${p.team}" class="token ${p.id==='C'?'charlotte':''}" style="--token:${p.id==='C'?'#d02b93':p.team==='Magic'?'#7448ad':'#b93443'}"><circle class="halo" r="29"/><circle class="disc" r="22"/><text class="number" y="7">${p.number}</text><text class="name" y="-37">${p.name}</text></g>`).join('')}</g><g id="ball" data-ball="one"><circle r="12" fill="#ff8b28" stroke="#713309" stroke-width="2"/><path d="M-11 0H11M0-11V11M-7-9Q3 0-7 9M7-9Q-3 0 7 9" fill="none" stroke="#713309" stroke-width="1.2"/></g></svg>`;}

return {ROSTER,courtModel,courtShell};})();
modules.ui=(()=>{const {createSlice,optionsFrom,SCENARIOS}=modules.director;const {courtModel,courtShell,ROSTER}=modules.court;

root.innerHTML=`<header class="masthead"><div class="brand"><span>CHARLOTTE’S</span><strong>BASKETBALL</strong><span>WORLD <b>●</b></span></div><p>REAL GAMES.<br>BIG CHOICES.<br><strong>YOUR STORY.</strong></p></header><main><section class="arena" aria-label="Game world"><div class="scoreboard"><div class="team magic"><span class="crest">✦</span><div>Magic<strong id="magic-score">0</strong></div></div><div class="time"><span id="half">1ST HALF</span><strong id="clock">20:00</strong></div><div class="team falcons"><div>Falcons<strong id="falcons-score">0</strong></div><span class="crest">➶</span></div></div><div class="court-row"><aside class="roster"><h2>YOUR TEAM</h2><h3>Magic</h3>${ROSTER.filter(p=>p.team==='Magic').map(p=>`<p class="${p.id==='C'?'you':''}"><b>${p.number}</b>${p.name}</p>`).join('')}</aside><div class="court-wrap"><div id="court">${courtShell()}</div><div class="court-caption"><span id="possession"></span><span id="direction"></span></div></div><aside class="roster opponents"><h2>OPPONENTS</h2><h3>Falcons</h3>${ROSTER.filter(p=>p.team==='Falcons').map(p=>`<p><b>${p.number}</b>${p.name}</p>`).join('')}</aside></div><div class="legend"><span><i class="pink">10</i> Charlotte · You</span><span><i class="purple"></i> Magic</span><span><i class="red"></i> Falcons</span></div></section><section class="moment" aria-label="Current play"><div class="character"><img src="assets/charlotte.png" alt="Charlotte, Magic number 10, ready to play"><span>CHARLOTTE <b>10</b></span></div><div class="moment-content"><div class="story" aria-live="polite" aria-atomic="true"><p class="eyebrow" id="cue"></p><h1 id="heading"></h1><p id="story"></p></div><div id="choices" class="choices"></div></div></section><section class="consequence" id="consequence" hidden><img id="outcome-art" alt=""><div><p class="eyebrow">IN THE MOMENT</p><h2 id="outcome-heading"></h2><p id="outcome-copy"></p></div></section><footer>Charlotte’s Basketball World <span>Game 1 · Experience preview</span></footer><section id="developer" hidden></section></main>`;
function drawCourt(c,v){
  const svg=$('court').firstElementChild;svg.dataset.possession=c.possession||'none';svg.dataset.direction=c.direction;

function render(){
