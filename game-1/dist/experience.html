<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Charlotte — Game 1 Court Preview</title><style>:root{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#183c3c;background:#f6f4ee;font-synthesis:none}*{box-sizing:border-box}body{margin:0}a{color:inherit}button{font:inherit}button,a{-webkit-tap-highlight-color:transparent}.masthead{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:23px max(24px,calc((100vw - 1120px)/2));border-bottom:1px solid #d8ded5;background:#fffdf7}.brand{font-size:12px;font-weight:850;letter-spacing:1.7px;text-decoration:none}.brand span{color:#69807c;display:inline-block;margin-left:15px}.preview-label{font-size:12px;color:#65746e}main{max-width:1050px;margin:auto;padding:28px 24px 40px}.intro{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.eyebrow{font-size:10px;letter-spacing:2px;font-weight:800;color:#57746a;margin:0 0 8px}h1{font-size:clamp(24px,3vw,36px);letter-spacing:-1px;margin:0}.legend{font-size:11px;display:flex;gap:14px;flex-wrap:wrap;color:#3b5551}.legend span{display:flex;align-items:center;gap:6px}.legend i{height:13px;width:13px;border-radius:50%;display:inline-flex;justify-content:center;align-items:center;font-style:normal}.magic{background:#126665}.falcons{background:#824282}.legend .you{background:#126665;color:#fff;width:20px;height:20px;border:3px solid #e9d497;font-size:10px}.game-panel{background:#fffdf8;border:1px solid #dce1d6;border-radius:18px;overflow:hidden;box-shadow:0 12px 35px #203d3210}.scoreboard{padding:16px 24px;display:flex;justify-content:space-between;align-items:center;background:#173f40;color:#fffdf5}.team-name{display:flex;gap:16px;align-items:center;font-size:12px;letter-spacing:2px;font-weight:800}.team-name strong{font-size:30px;letter-spacing:0;min-width:27px}.clock{text-align:center;display:grid;gap:2px}.clock span{font-size:9px;letter-spacing:2px;color:#bed6ca}.clock strong{font-size:23px;font-variant-numeric:tabular-nums;letter-spacing:1px}.court-status{display:flex;justify-content:space-between;gap:12px;padding:10px 22px;font-size:12px;font-weight:700;background:#e9eee3;color:#294d44}.court{display:block;width:100%;max-height:420px;background:#e9eee3;padding:0 12px 12px}.player{transition:transform .65s ease}.basketball{transition:transform .6s ease}.story{padding:22px 26px 10px}.story h2{font-size:clamp(21px,2.6vw,28px);line-height:1.2;margin:0 0 10px;letter-spacing:-.5px;outline:none}.story p:last-child{font-size:15px;line-height:1.6;color:#4e625b;margin:0;max-width:800px}.choices{display:flex;gap:10px;padding:10px 26px 24px;flex-wrap:wrap}.action{min-height:49px;flex:1;padding:13px 18px;border-radius:10px;border:1px solid #176561;background:#176561;color:#fffef4;font-size:14px;font-weight:650;cursor:pointer;box-shadow:0 2px 0 #083d3b;transition:background .15s}.action:hover{background:#0d514f}.action:active{transform:translateY(1px)}.action:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #e78e37;outline-offset:4px}.secondary{background:#fff;color:#254f48;border-color:#b1c6bc;box-shadow:none}.secondary:hover{background:#e5eee6}.below{display:flex;justify-content:space-between;align-items:center;gap:20px;font-size:12px;color:#567269;margin-top:15px}.below p{line-height:1.6;margin:0}.below span{color:#829087}.below a{font-weight:700;text-underline-offset:4px;white-space:nowrap}.slice-end{margin:0;padding:0 26px 23px;color:#57746a;font-size:13px}.outside-court{padding:35px;text-align:center;color:#587269;line-height:1.8}.outside-court small{font-size:12px}#qa-tools{font-size:12px;margin-top:25px;border-top:1px solid #d4ddd4;padding-top:20px}#qa-tools summary{cursor:pointer}#qa-tools pre{max-height:250px;overflow:auto;font-size:11px}#qa-tools .choices{padding:15px 0}.flying circle{stroke-width:3}.flying{filter:drop-shadow(-10px 7px 3px #67 </style></head><body><div id="experience-root"></div><script>if(new URLSearchParams(location.search).get('full')==='1'){document.open();document.write("<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Charlotte’s Basketball World — Game 1</title><style>body{font:16px system-ui;margin:auto;max-width:850px;padding:12px;background:#eee8dc;color:#18352d}.hero,.score{background:#123e34;color:#fff;border-radius:18px;padding:16px}.card{background:#fff;border-radius:18px;padding:14px;margin:12px 0}.score{display:flex;justify-content:space-between;font-size:24px}.score small{display:block;font-size:10px}.scene{background:#fbf7ef;border-radius:14px;padding:18px;min-height:150px;line-height:1.5}.choice{display:block;width:100%;padding:12px;margin:6px 0;border:0;border-radius:12px;background:#17483c;color:#fff;font-weight:700;text-align:left}.orange{background:#e77b36}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:6px 8px;background:#f7f3eb;border-radius:99px;font-size:11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{padding:8px;background:#f7f3eb;border-radius:10px}.stat small{display:block;font-size:8px}.qa,.trace{background:#17251f;color:#dfeae5;padding:10px;border-radius:10px;font:11px monospace;max-height:300px;overflow:auto}.qaHarness{display:none}.qaHarness.on{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}@media(max-width:600px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}\n.qaOnly{display:none}body.testing .qaOnly{display:block}.scene{white-space:pre-line}button:focus-visible{outline:3px solid #e77b36;outline-offset:2px}.history{font-size:13px;max-height:260px;overflow:auto}.history p{border-bottom:1px solid #ddd;padding-bottom:8px}.muted{font-size:12px}.qaGrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}\n</style></head><body>\n<header class=\"hero\"><b>GAME 1 · ASK FOR IT</b><h1>Charlotte’s Basketball World</h1><div>You’re in the game. Make your move when it matters and see what happens.</div></header>\n<section class=\"card\"><div class=\"score\"><div><small>MAGIC — FALCONS</small><span id=\"m\">0</span> — <span id=\"f\">0</span></div><div><small id=\"h\">1ST HALF</small><span id=\"c\">20:00</span></div></div>\n<div class=\"chips\"><span class=\"chip\">Ball: <b id=\"ball\">dead</b></span><span class=\"chip\">Pressure: <b id=\"p\">low</b></span><span class=\"chip\">Fatigue: <b id=\"fat\">low</b></span><span class=\"chip\">Possession: <b id=\"pid\">—</b></span></div>\n<div id=\"scene\" class=\"scene\" aria-live=\"polite\"></div><div id=\"choices\"></div></section>\n<section class=\"card stats\"><div class=\"stat\"><small>Decisions</small><b id=\"d\">0</b></div><div class=\"stat\"><small>Shots</small><b id=\"s\">0</b></div><div class=\"stat\"><small>Your rebounds</small><b id=\"r\">0</b></div><div class=\"stat\"><small>Your points</small><b id=\"pts\">0</b></div><div class=\"stat\"><small>Your stops</small><b id=\"st\">0</b></div><div class=\"stat\"><small>Team turnovers, both sides</small><b id=\"to\">0</b></div></section>\n<details class=\"card\"><summary>Game recap</summary><div id=\"history\" class=\"history\"></div></details>\n<section class=\"card qaOnly\"><b>Direct QA · Engine 1.4.0 · NOT CERTIFIED</b><p class=\"muted\">Fixtures use the production controls and engine. Entering a fixture resets only this browser session.</p><div id=\"fixtures\" class=\"qaGrid\"></div><button id=\"contract\" class=\"choice orange\">RUN CONTRACT CHECKS</button><pre id=\"qa\"></pre><details><summary>State and complete event trace</summary><pre id=\"state\"></pre><pre id=\"trace\" class=\"trace\"></pre></details></section>\n<script>const VERSION = 'G1-engine-1.4.0';\nconst other = team => team === 'Magic' ? 'Falcons' : 'Magic';\nconst possessionId = n => 'G1-P' + String(n).padStart(2, '0');\n\n// The engine owns score, clock, ball and possession. Presentation receives copies.\nfunction createEngine(seed = 314159, rolls = []) {\n  let rng = seed >>> 0, scripted = [...rolls], events = [];\n  let x = { version: VERSION, seed, half: 1, clock: 1200, score: {Magic: 0, Falcons: 0},\n    team: null, pos: 0, phase: 'opening', ball: 'dead', nextTeam: null,\n    decisions: 0, shots: 0, points: 0, rebounds: 0, stops: 0, turnovers: 0,\n    teamRebounds: {Magic: 0, Falcons: 0}, teamTurnovers: {Magic: 0, Falcons: 0},\n    pressure: 'low', fatigue: 'low', attempt: null, freeThrows: null, ended: false,\n    restartTeam: 'Falcons', askedForBall: 0, wentIntoSpace: 0, goodPasses: 0, bravePlays: 0,\n    looseBalls: 0, wentAfterBall: 0, trust: 0, attention: 0, recoveredAfterMistake: 0, mistake: false };\n  const state = () => structuredClone(x);\n  function emit(type, detail = {}) {\n    events.push({id: 'E' + (events.length + 1), type, cause: detail.cause || type.toLowerCase(),\n      playerAction: null, physicalOutcome: null, scoreChange: 0, possessionChange: null,\n      ...detail, stateAfter: state()});\n  }\n  function requirePhase(...phases) {\n    if (x.ended || !phases.includes(x.phase)) throw Error('Invalid action in ' + x.phase);\n  }\n  function random() {\n    const before = rng;\n    rng = (Math.imul(1664525, rng) + 1013904223) >>> 0;\n    const value = scripted.length ? scripted.shift() : rng / 4294967296;\n    if (!(value >= 0 && value < 1)) throw Error('Invalid random input');\n    emit('RANDOM_DRAW', {seedBefore: before, value});\n    return value;\n  }\n  function pressure() {\n    x.pressure = x.clock <= 120 ? 'late' : x.clock <= 480 ? 'high' : x.clock <= 900 ? 'moderate' : 'low';\n    const elapsed = (x.half - 1) * 1200 + 1200 - x.clock;\n    x.fatigue = elapsed >= 1800 ? 'high' : elapsed >= 900 ? 'moderate' : 'low';\n  }\n  function tick(seconds, cause) {\n    requirePhase('live', 'rebound', 'attempt');\n    if (!Number.isInteger(seconds) || seconds < 0 || seconds > 30 || !cause) throw Error('Clock requires a bounded live event');\n    const elapsed = Math.min(seconds, x.clock);\n    x.clock -= elapsed; pressure();\n    emit('CLOCK_TICK', {cause, elapsed});\n  }\n  function begin(team, cause) {\n    if (!['Magic', 'Falcons'].includes(team) || x.ended || !['opening', 'between', 'halftime'].includes(x.phase)) throw Error('Invalid possession start');\n    x.team = team; x.pos++; x.phase = 'live'; x.ball = 'live'; x.nextTeam = null;\n    x.attempt = null;\n    emit('POSSESSION_START', {cause, possessionChange: team, possessionId: possessionId(x.pos)});\n  }\n  function end(cause, nextTeam) {\n    x.phase = 'between'; x.ball = 'dead'; x.nextTeam = nextTeam;\n    emit('POSSESSION_END', {cause, nextTeam, possessionId: possessionId(x.pos)});\n  }\n  function boundary() {\n    if (x.phase === 'halftime' || x.ended) return true;\n    if (x.clock !== 0 || x.phase === 'free_throw') return false;\n    if (x.phase !== 'between') end('period_expired', null);\n    x.restartTeam = x.nextTeam || other(x.team || 'Magic');\n    x.nextTeam = null; x.team = null;\n    if (x.half === 1) { x.phase = 'halftime'; x.ball = 'dead'; emit('HALFTIME'); }\n    else { x.phase = 'final'; x.ball = 'ended'; x.ended = true; emit('FINAL_WHISTLE', {finalScore: {...x.score}}); }\n    return true;\n  }\n  function advance() {\n    requirePhase('between');\n    if (!boundary()) begin(x.nextTeam, 'resolved_possession');\n  }\n  function decision(choices, chosen, type, id) {\n    requirePhase('live', 'rebound', 'attempt');\n    if ((type === 'shooting' ? choices.length !== 4 : choices.length !== 3) || !choices.includes(chosen)) throw Error('Choice contract');\n    x.decisions++;\n    emit('DECISION', {playerAction: chosen, decisionType: type, decisionId: id,\n      choiceId: id + '-C' + (choices.indexOf(chosen) + 1), choices: [...choices]});\n  }\n  function prepareShot(value, shooter = 'teammate') {\n    requirePhase('live');\n    if (![2, 3].includes(value) || !['you', 'teammate', 'opponent'].includes(shooter)) throw Error('Attempt contract');\n    if ((shooter === 'opponent') !== (x.team === 'Falcons')) throw Error('Shooter ownership');\n    x.attempt = {team: x.team, shooter, value}; x.phase = 'attempt';\n    if (shooter === 'you') x.shots++;\n    emit('ATTEMPT_ESTABLISHED', {team: x.team, shotValue: value, shooter,\n      physicalOutcome: value === 3 ? 'three_point_attempt' : 'two_point_attempt'});\n  }\n  function score(team, value, type, detail) {\n    x.score[team] += value;\n    if (detail.shooter === 'you') x.points += value;\n    emit(type, {...detail, team, scoreChange: value});\n  }\n  function resolveShot({make = .40, block = .08, foul = .12} = {}) {\n    requirePhase('attempt');\n    if ([make, block, foul].some(v => v < 0) || make + block + foul > 1) throw Error('Shot probabilities');\n    const a = {...x.attempt}, r = random();\n    const outcome = r < make ? 'made' : r < make + block ? 'blocked' : r < make + block + foul ? 'foul' : 'miss';\n    emit('SHOT_OUTCOME', {...a, shotValue: a.value, physicalOutcome: outcome});\n    if (outcome === 'made') {\n      score(a.team, a.value, 'MADE_BASKET', {...a, physicalOutcome: 'made_basket'});\n      end('made_basket', other(a.team));\n    } else if (outcome === 'foul') {\n      x.phase = 'free_throw'; x.ball = 'free_throw';\n      x.freeThrows = {team: a.team, shooter: a.shooter, total: 2, next: 1};\n      emit('SHOOTING_FOUL', {freeThrows: 2, team: a.team});\n    } else {\n      x.phase = 'rebound'; x.ball = 'live';\n      emit(outcome === 'miss' ? 'SHOT_MISS' : 'SHOT_BLOCK', {team: a.team, physicalOutcome: outcome});\n    }\n    return {...a, outcome};\n  }\n  function rebound(actionIndex) {\n    requirePhase('rebound');\n    if (![0, 1, 2].includes(actionIndex)) throw Error('Rebound action');\n    if (x.clock === 0) { boundary(); return {expired: true}; }\n    const offense = x.team, r = random();\n    // Positioning changes chances; no button selects the winner.\n    const you = offense === 'Magic' ? [.22, .04, .08][actionIndex] : [.40, .18, .24][actionIndex];\n    const teammate = offense === 'Magic' ? [.16, .20, .28][actionIndex] : [.35, .48, .46][actionIndex];\n    const winner = r < you ? 'you' : r < you + teammate ? 'teammate' : 'opponent';\n    const team = winner === 'opponent' ? 'Falcons' : 'Magic';\n    if (actionIndex === 0) x.wentAfterBall++;\n    if (winner === 'you') { x.rebounds++; x.looseBalls++; }\n    x.teamRebounds[team]++;\n    x.phase = 'live'; x.attempt = null;\n    emit('REBOUND_OUTCOME', {winner, team, physicalOutcome: winner + '_rebound', offensive: team === offense});\n    if (team === offense) emit('SECOND_CHANCE', {team, physicalOutcome: 'offense_retains_ball'});\n    else end('defensive_rebound', team);\n    return {winner, team, offensive: team === offense};\n  }\n  function freeThrow(makeChance = .65) {\n    requirePhase('free_throw');\n    const f = {...x.freeThrows}, made = random() < makeChance;\n    if (made) score(f.team, 1, 'FREE_THROW_MADE', {...f, index: f.next, physicalOutcome: 'made_free_throw'});\n    else emit('FREE_THROW_MISSED', {...f, index: f.next, physicalOutcome: 'missed_free_throw'});\n    x.freeThrows.next++;\n    if (f.next === f.total) {\n      x.freeThrows = null;\n      if (made) end('last_free_throw_made', other(f.team));\n      else { x.phase = 'rebound'; x.ball = 'live'; emit('LIVE_BALL', {cause: 'last_free_throw_missed'}); }\n    }\n    return {made, index: f.next, total: f.total, team: f.team};\n  }\n  function turnover(cause = 'lost_ball', stealBy = null) {\n    requirePhase('live');\n    const team = x.team;\n    x.teamTurnovers[team]++; x.turnovers++;\n    emit('TURNOVER', {team, physicalOutcome: cause});\n    if (team === 'Magic') x.mistake = true;\n    if (stealBy) { if (stealBy === 'you') { x.stops++; if(x.mistake)x.recoveredAfterMistake++; x.mistake=false; } emit('STEAL', {team: other(team), player: stealBy, physicalOutcome: 'steal'}); }\n    end(cause, other(team));\n  }\n  function defend(actionIndex, vulnerable = false) {\n    requirePhase('live');\n    if (x.team !== 'Falcons' || ![0, 1, 2].includes(actionIndex)) throw Error('Defence contract');\n    const chance = vulnerable ? [.65, .80, .45][actionIndex] : [.08, .14, .04][actionIndex];\n    const success = random() < chance;\n    if (success) turnover('defensive_pressure', 'you');\n    else emit('DEFENSIVE_RECOVERY', {physicalOutcome: actionIndex === 1 ? 'dribbler_gets_past' : 'opponent_retains_ball'});\n    return success;\n  }\n  function deadBall(cause = 'out_of_bounds') {\n    requirePhase('live'); x.phase = 'dead_ball'; x.ball = 'dead'; emit('DEAD_BALL', {cause});\n  }\n  function restart() {\n    requirePhase('dead_ball'); x.phase = 'live'; x.ball = 'live'; emit('RESTART', {team: x.team});\n  }\n  function resume() {\n    requirePhase('halftime'); x.half = 2; x.clock = 1200; pressure();\n    begin(x.restartTeam, 'second_half_restart'); emit('SECOND_HALF_START');\n  }\n  function seekBall(index) {\n    requirePhase('live'); if(x.team!=='Magic'||![0,1,2].includes(index))throw Error('Offence contract');\n    if(index===0){x.askedForBall++;x.trust=Math.min(5,x.trust+1);x.attention=Math.min(5,x.attention+1);x.bravePlays++;}\n    if(index===1){x.wentIntoSpace++;x.trust=Math.min(5,x.trust+.5);}\n    const r=random(), receive=[.60+x.trust*.025,.50+x.trust*.025,.18][index];\n    if(index===0&&r>.94){turnover('pass_intercepted');return 'intercepted';}\n    const outcome=r<receive?'received':'teammate_continues';\n    emit('PASS', {physicalOutcome:outcome, playerAction:index});return outcome;\n  }\n  function handleBall(index) {\n    requirePhase('live');if(x.team!=='Magic'||![0,1,2].includes(index))throw Error('Ball handling contract');\n    const r=random();\n    if(r>(index===1?.90:index===2?.78:.92)){turnover('ball_intercepted');return 'turnover';}\n    if(index===0&&r<.72){x.bravePlays++;emit('DRIVE',{physicalOutcome:'scoring_space'});return 'shot';}\n    x.goodPasses++;emit('PASS',{physicalOutcome:'teammate_receives'});return 'pass';\n  }\n  return {state, trace: () => structuredClone(events), decision, tick, random, prepareShot,\n    resolveShot, rebound, freeThrow, turnover, defend, deadBall, restart, advance, boundary, resume, seekBall, handleBall,\n    start() { requirePhase('opening'); begin('Magic', 'opening_tip'); emit('TIP_OFF', {physicalOutcome: 'Magic_win_tip'}); },\n    annotate(type, detail) { emit(type, detail); }};\n}\n\nconst NORMAL = ['Call for the ball','Move into the open space','Keep moving and stay ready'];\nconst SHOTS = ['Pump fake, then layup','Drive for the layup','Take the shot','Side step and take the shot'];\nconst REBOUNDS = ['Go after the ball','Get back to defend','Stay ready for the next play'];\nconst DEFENCE = ['Stay in front of them','Move quickly to cut off their path','Protect the basket'];\nconst DEF_SHOTS = ['Put your hand up and make the shot difficult','Jump to try to block the shot','Get ready for the rebound'];\nconst RECOVERY = ['Get back to defend','Find your player','Move towards the ball'];\nconst BALL_HAND = ['Move towards the basket','Pass to the open teammate','Keep the ball and look again'];\n// Authored slot identity is independent from runtime possession identity.\n// Branch-only slots are emitted by the live chain; anchors wait for the correct owner.\nconst SPINE = [\n  ['P01',1,1200,'tip'],['P02',1,1176,'normal','Magic'],['P03',1,null,'branch'],\n  ['P04',1,1080,'defence','Falcons'],['P05',1,990,'background','Magic'],\n  ['P06',1,945,'normal','Magic'],['P07',1,null,'branch'],['P08',1,870,'defence','Falcons'],\n  ['P09',1,810,'shooting','Magic'],['P10',1,null,'branch'],['P11',1,null,'branch'],\n  ['P12',1,690,'defence','Falcons'],['P13',1,570,'normal','Magic'],['P14',1,null,'branch'],\n  ['P15',1,450,'recovery','Falcons'],['P16',1,330,'normal','Magic'],['P17',1,150,'normal','Magic'],\n  ['P18',1,0,'halftime'],['P19',2,1200,'restart'],['P20',2,1170,'normal','Magic'],\n  ['P21',2,null,'branch'],['P22',2,960,'shooting','Magic'],['P23',2,900,'defence','Falcons'],\n  ['P24',2,720,'normal','Magic'],['P25',2,540,'event'],['P26',2,360,'normal','Magic'],\n  ['P27',2,240,'normal','Magic'],['P28',2,120,'late'],['P29',2,30,'final_play'],['P30',2,0,'final']\n].map(([id,half,clock,kind,team])=>({id,half,clock,kind,team}));\nconst fmt = clock => String(Math.floor(clock / 60)).padStart(2,'0') + ':' + String(clock % 60).padStart(2,'0');\nfunction shotText(result) {\n  const who = result.shooter === 'you' ? 'Your' : result.team === 'Magic' ? 'Your teammate’s' : 'The Falcons’';\n  const shot = result.value === 3 ? 'three-point shot' : 'shot';\n  if (result.outcome === 'made') return `${who} ${shot} is good! ${result.value} points for ${result.team}.`;\n  if (result.outcome === 'foul') return `${who} ${shot} draws a shooting foul. No basket. Two free throws for ${result.team}.`;\n  return `${who} ${shot} ${result.outcome === 'blocked' ? 'is blocked' : 'misses'}. No points. The ball is live.`;\n}\nfunction reboundText(r) {\n  if(r.expired) return 'The horn sounds before anyone can collect the rebound.';\n  const who = r.winner === 'you' ? 'You win the rebound.' : r.winner === 'teammate' ? 'Your teammate wins the rebound.' : 'The Falcons win the rebound.';\n  return `${who} ${r.offensive ? r.team + ' keep the same possession for a second chance.' : r.team + ' have the ball next.'}`;\n}\nfunction freeThrowText(f) {\n  return `${f.index === 1 ? 'First' : 'Second'} free throw for ${f.team}: ${f.made ? 'good! One point.' : 'missed. No point.'}`;\n}\n\nfunction runContracts() {\n  const results=[];\n  function check(name,run){try{run();results.push({name,pass:true});}catch(e){results.push({name,pass:false,error:e.message});}}\n  const ok=(v,msg)=>{if(!v)throw Error(msg||'contract failed');};\n  check('Locked choices',()=>{\n    ok([NORMAL,REBOUNDS,DEFENCE,DEF_SHOTS].every(c=>c.length===3));\n    ok(JSON.stringify(SHOTS)===JSON.stringify(['Pump fake, then layup','Drive for the layup','Take the shot','Side step and take the
